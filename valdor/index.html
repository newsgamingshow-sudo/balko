<title>Arènes de Valdor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Mise en page : un écran de jeu (16:9 pixelisé) au-dessus, la fiche du héros dessous. Univers : pierre froide, or terni, braise. */
:root{
  --night:#141019; --stone:#221c28; --stone-2:#2e2636; --edge:#4a3d52; --parch:#efe2c4; --muted:#b8a98c;
  --gold:#e8b44a; --gold-ink:#2a1a05; --ember:#ff6a2b; --blood:#c8323c; --heal:#5fc46d;
  --r0:#a7a3a0; --r1:#5fc46d; --r2:#4f8fe8; --r3:#b267f0; --r4:#ff9b2e;
  --title:"Pixelify Sans","Courier New",monospace; --body:"Alegreya Sans",Georgia,serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2a1f33,var(--night) 60%);color:var(--parch);font:17px/1.45 var(--body);min-height:100%}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3,.px{font-family:var(--title);font-weight:700;letter-spacing:.02em;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.topbar h1{font-size:26px;color:var(--gold);text-shadow:0 2px 0 #000}
.purse{display:flex;gap:14px;font-family:var(--title);font-size:18px}
.purse span b{color:var(--gold)}

/* Écran de jeu */
.stage{position:relative;border:3px solid var(--edge);border-radius:6px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
#bg{image-rendering:pixelated;image-rendering:crisp-edges}
.bars{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:8px 10px;pointer-events:none;font-family:var(--title)}
.bar{display:grid;gap:3px;min-width:0}
.bar .nm{font-size:clamp(11px,2.2vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 #000}
.bar .hp{height:clamp(8px,1.6vw,12px);background:#2b0f12;border:2px solid #000;position:relative}
.bar .hp i{position:absolute;inset:0;right:auto;background:linear-gradient(#e5525c,var(--blood));transition:width .25s}
.bar .hp u{position:absolute;inset:0;right:auto;background:#ffd2a8;transition:width .8s .2s}
.bar.r{text-align:right}.bar.r .hp i,.bar.r .hp u{left:auto;right:0}
.vs{align-self:center;color:var(--gold);font-size:clamp(12px,2.4vw,18px);text-shadow:0 1px 0 #000}
.stage-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--title);background:rgba(10,7,14,.82);border:2px solid var(--edge);border-radius:6px;padding:14px 20px;min-width:min(320px,80%)}
.stage-msg h2{font-size:clamp(20px,4vw,30px);color:var(--gold)}
.stage-msg p{margin:6px 0 0;font-family:var(--body);color:var(--muted)}
.speed{position:absolute;right:8px;bottom:8px;background:rgba(10,7,14,.75);border:2px solid var(--edge);border-radius:4px;padding:4px 10px;font-family:var(--title);cursor:pointer}

/* Actions */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.btn{border:0;border-radius:4px;padding:14px 16px;font-family:var(--title);font-size:18px;cursor:pointer;background:var(--gold);color:var(--gold-ink);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 2px 0 #000}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.btn.dark{background:var(--stone-2);color:var(--parch);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 2px 0 #000;border:2px solid var(--edge)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-family:var(--body);font-size:13px;opacity:.8;font-weight:500}

/* Panneaux */
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media (max-width:820px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
.panel{background:linear-gradient(var(--stone-2),var(--stone));border:2px solid var(--edge);border-radius:6px;padding:14px;min-width:0}
.panel h2{font-size:17px;color:var(--gold);margin-bottom:10px}
.hero{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.hero canvas{width:96px;height:96px;background:radial-gradient(#3a2f44,#1b1520);border:2px solid var(--edge);border-radius:4px}
.lvl{font-family:var(--title);font-size:22px}
.xp{height:10px;background:#120d16;border:2px solid #000;margin-top:6px;position:relative}
.xp i{position:absolute;inset:0;right:auto;background:linear-gradient(#ffe08a,var(--gold))}
.xpt{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:12px;font-variant-numeric:tabular-nums}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--edge);padding:3px 0}
.stats span{color:var(--muted)}
.power{margin-top:10px;font-family:var(--title);text-align:center;color:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.slot,.cell{aspect-ratio:1;max-width:100%;background:#120d16;border:2px solid var(--edge);border-radius:4px;display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.slot img,.cell img{width:70%;height:70%;image-rendering:pixelated}
.slot .lab{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-family:var(--title)}
.slot.empty{cursor:default;opacity:.6}
.r0{border-color:var(--r0)}.r1{border-color:var(--r1)}.r2{border-color:var(--r2)}.r3{border-color:var(--r3)}.r4{border-color:var(--r4);box-shadow:0 0 10px rgba(255,155,46,.45)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.cell .new{position:absolute;top:-6px;right:-6px;background:var(--ember);color:#fff;font:700 10px var(--title);padding:1px 4px;border-radius:3px}
.empty-inv{color:var(--muted);font-size:15px;grid-column:1/-1;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{background:transparent;border:2px solid var(--edge);border-radius:4px;padding:5px 12px;font-family:var(--title);cursor:pointer;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--edge);color:var(--parch)}
.bosses{display:grid;gap:8px}
.boss{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:#120d16;border:2px solid var(--edge);border-radius:4px;padding:8px}
.boss canvas{width:56px;height:56px}
.boss h3{font-size:16px}
.boss p{margin:2px 0 0;color:var(--muted);font-size:14px}
.boss .btn{padding:8px 12px;font-size:15px}
.log{max-height:220px;overflow:auto;font-size:15px;color:var(--muted);display:grid;gap:3px}
.log b{color:var(--parch)}

/* Fenêtres */
.modal{position:fixed;inset:0;background:rgba(5,3,8,.78);display:grid;place-items:center;z-index:20;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{background:linear-gradient(var(--stone-2),var(--stone));border:2px solid var(--edge);border-radius:8px;padding:18px;width:min(420px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.card h2{font-size:22px}
.itemhead{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.itemhead .ic{width:64px;height:64px;background:#120d16;border:3px solid;border-radius:6px;display:grid;place-items:center}
.itemhead .ic img{width:44px;height:44px;image-rendering:pixelated}
.rar{font-family:var(--title);font-size:14px}
.cmp{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.cmp div{display:flex;justify-content:space-between}
.up{color:var(--heal)}.down{color:var(--blood)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.chest{display:grid;place-items:center;gap:10px;text-align:center}
.chest canvas{width:192px;height:192px;image-rendering:pixelated}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-4px,1px) rotate(-3deg)}40%{transform:translate(4px,-1px) rotate(3deg)}60%{transform:translate(-3px,0) rotate(-2deg)}80%{transform:translate(3px,1px) rotate(2deg)}}
.shake{animation:shake .4s infinite}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
.foot{margin-top:18px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
</style>

<div class="wrap">
  <div class="topbar">
    <h1>Arènes de Valdor</h1>
    <div class="purse"><span>Or <b id="gold">0</b></span><span>Victoires <b id="wins">0</b></span></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="bg" width="320" height="180"></canvas>
    <canvas id="fx" width="320" height="180"></canvas>
    <div class="bars" id="bars" hidden>
      <div class="bar"><div class="nm" id="nmA"></div><div class="hp"><u id="hpAu"></u><i id="hpA"></i></div></div>
      <div class="vs">VS</div>
      <div class="bar r"><div class="nm" id="nmB"></div><div class="hp"><u id="hpBu"></u><i id="hpB"></i></div></div>
    </div>
    <div class="stage-msg" id="msg"><h2 id="msgT">Cour de Valdor</h2><p id="msgP">Lancez un combat : votre héros se bat tout seul.</p></div>
    <button class="speed" id="speed" type="button" hidden>×1</button>
  </div>

  <div class="actions">
    <button class="btn" id="findBtn" type="button">Trouver un combat<small>Arène · adversaire de votre niveau</small></button>
    <button class="btn dark" id="bossBtn" type="button">Affronter un boss<small>Coffres et objets rares</small></button>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="hero"><canvas id="portrait" width="192" height="192"></canvas>
        <div><div class="px" id="heroName">Héros</div><div class="lvl">Niveau <span id="lvl">1</span></div>
          <div class="xp"><i id="xpbar"></i></div><div class="xpt" id="xpt"></div></div></div>
      <div class="stats" id="stats"></div>
      <div class="power" id="power"></div>
      <div class="slots" id="slots"></div>
    </div>
    <div class="panel">
      <div class="tabs" role="tablist"><button class="tab" role="tab" data-v="inv" aria-selected="true" type="button">Sac</button><button class="tab" role="tab" data-v="boss" aria-selected="false" type="button">Boss</button><button class="tab" role="tab" data-v="log" aria-selected="false" type="button">Journal</button></div>
      <div id="v-inv"><div class="inv" id="inv"></div></div>
      <div id="v-boss" hidden><div class="bosses" id="bossList"></div></div>
      <div id="v-log" hidden><div class="log" id="log"></div></div>
    </div>
  </div>
  <div class="foot"><span>Prototype · les adversaires de l'arène sont contrôlés par l'ordinateur.</span><button class="linkbtn" id="resetBtn" type="button">Recommencer à zéro</button></div>
</div>

<div class="modal" id="modal" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// =================== DONNÉES ===================
const RAR=[{n:"Commun",c:"#a7a3a0",m:1},{n:"Peu commun",c:"#5fc46d",m:1.25},{n:"Rare",c:"#4f8fe8",m:1.55},{n:"Épique",c:"#b267f0",m:1.9},{n:"Légendaire",c:"#ff9b2e",m:2.4}];
const SLOTS={weapon:"Arme",helm:"Casque",armor:"Armure",amulet:"Amulette"};
const BASES={
  weapon:{sword:["Épée rouillée","Épée de fer","Épée d'acier","Lame runique","Lame de Valdor"],axe:["Hachette ébréchée","Hache de bûcheron","Hache de guerre","Hache runique","Hache des rois"],hammer:["Gourdin noueux","Masse de fer","Marteau d'armes","Marteau runique","Marteau du tonnerre"]},
  helm:["Capuche de cuir","Casque de fer","Heaume d'acier","Heaume runique","Couronne de Valdor"],
  armor:["Tunique usée","Cotte de mailles","Plastron d'acier","Armure runique","Armure de Valdor"],
  amulet:["Pendentif de bois","Amulette de cuivre","Talisman d'argent","Amulette runique","Cœur de Valdor"]
};
const SUFFIX=["","du loup","de braise","des anciens","du roi déchu"];
const STAT_N={atk:"Attaque",def:"Défense",hp:"Vie",spd:"Vitesse",crit:"Critique"};
const NAMES=["Aldric","Brunehilde","Garen le Gris","Isolde","Thibault Croc-d'Acier","Morgane","Eudes le Brave","Sigrid","Bertrand","Ysolde","Gauvain","Mahaut","Roland","Aénor","Hugues Main-Noire","Clothilde","Tancrède","Ermengarde","Baudouin","Mélisende"];
const BOSSES=[
  {id:"gob",n:"Grokk, chef gobelin",lvl:3,kind:"goblin",arena:"forest",desc:"Petit, vif et sournois."},
  {id:"troll",n:"Troll des marais",lvl:6,kind:"troll",arena:"swamp",desc:"Encaisse énormément de coups."},
  {id:"spectre",n:"Chevalier spectral",lvl:10,kind:"spectre",arena:"crypt",desc:"Frappe vite, esquive souvent."},
  {id:"dragon",n:"Ignaros, dragon de braise",lvl:15,kind:"dragon",arena:"volcano",desc:"Crache du feu sous 50 % de vie."}
];
const ARENAS={
  court:{sky:0x2a2344,fog:0x2a2344,floor:["#5b5560","#4d4752"],wall:0x6a6270,light:0xffa050,amb:0x6a5a8a,ember:0xff8a3a},
  forest:{sky:0x1d3324,fog:0x1d3324,floor:["#3f5a2f","#35502a"],wall:0x3a4a2e,light:0xffcc66,amb:0x4d6a4a,ember:0xc8ff6a},
  swamp:{sky:0x1a2a26,fog:0x203a30,floor:["#2f4436","#283b2f"],wall:0x324238,light:0x9cff8a,amb:0x3f5a50,ember:0x9cff8a},
  crypt:{sky:0x101629,fog:0x152040,floor:["#3a4058","#30364c"],wall:0x3c4466,light:0x7fb6ff,amb:0x40507a,ember:0x9fd0ff},
  volcano:{sky:0x2a0e0a,fog:0x3a120a,floor:["#4a2a24","#3c221d"],wall:0x4a2c26,light:0xff6a2b,amb:0x7a3a2a,ember:0xff7a2b}
};

// =================== SAUVEGARDE ===================
const KEY="valdor-save-v1";
function freshSave(){return {lvl:1,xp:0,gold:0,wins:0,losses:0,uid:1,equip:{weapon:null,helm:null,armor:null,amulet:null},bag:[],bossWins:{},log:[]}}
let S=freshSave();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(freshSave(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
if(!S.equip.weapon){S.equip.weapon=makeItem("weapon",1,0,"sword");S.equip.armor=makeItem("armor",1,0);save()}

// =================== OBJETS ===================
function makeItem(slot,ilvl,rar,wtype){
  const tier=clamp(Math.floor((ilvl-1)/4),0,4);
  let name,type=null;
  if(slot==="weapon"){type=wtype||pick(["sword","axe","hammer"]);name=BASES.weapon[type][tier]}else name=BASES[slot][tier];
  if(rar>=2)name+=" "+SUFFIX[rar];
  const m=RAR[rar].m,st={};
  if(slot==="weapon"){st.atk=Math.round((4+ilvl*2.2)*m*(type==="hammer"?1.15:type==="axe"?1.05:1));if(type==="sword")st.spd=Math.round(1+rar)}
  if(slot==="helm"){st.def=Math.round((1+ilvl*.8)*m);st.hp=Math.round((6+ilvl*4)*m)}
  if(slot==="armor"){st.hp=Math.round((12+ilvl*8)*m);st.def=Math.round((2+ilvl*1.1)*m)}
  if(slot==="amulet"){st.crit=Math.round((2+ilvl*.35)*m);st.spd=Math.round((1+ilvl*.25)*m)}
  if(rar>=1){const extra=pick(["atk","def","hp","spd","crit"]);st[extra]=(st[extra]||0)+Math.round((extra==="hp"?5+ilvl*3:1+ilvl*.4)*rar*.6)}
  return {id:S?S.uid++:0,slot,type,ilvl,rar,name,st,isNew:true};
}
function rollRar(w){let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<w.length;i++){if((r-=w[i])<0)return i}return 0}
function sellPrice(it){return Math.round((5+it.ilvl*3)*RAR[it.rar].m*(1+it.rar))}

// =================== STATS ===================
function heroStats(){
  const L=S.lvl,s={hp:90+L*18,atk:8+L*2.5,def:2+L*.9,spd:10+L*.15,crit:5};
  for(const k in S.equip){const it=S.equip[k];if(it)for(const st in it.st)s[st]+=it.st[st]}
  for(const k in s)s[k]=Math.round(s[k]);return s;
}
const power=s=>Math.round(s.atk*2+s.def*1.6+s.hp*.25+s.spd*1.5+s.crit*2);
const xpNeed=l=>Math.round(40*Math.pow(l,1.55));

// =================== APPARENCE : STICKMEN ===================
const ARMOR_COL=["#9a7a56","#6fb07a","#6f9ee8","#b47cf0","#ffb347"];
const ARMOR_DK=["#56402a","#4f654c","#5a6f8a","#634788","#a87a1f"];
function heroLook(){
  const e=S.equip;return {line:"#f6efe2",armor:e.armor?ARMOR_COL[e.armor.rar]:null,helm:e.helm?ARMOR_COL[e.helm.rar]:null,
    weapon:e.weapon?e.weapon.type:"fist",wcol:e.weapon?RAR[e.weapon.rar].c:"#ddd",wrar:e.weapon?e.weapon.rar:0,
    amulet:e.amulet?RAR[e.amulet.rar].c:null,scarf:S.lvl>=3?(e.weapon?RAR[e.weapon.rar].c:"#e8b44a"):null,k:1,thick:1};
}
function randomLook(lvl){
  const r=clamp(Math.floor(lvl/4),0,4),ar=clamp(r+ri(-1,1),0,4),wr=clamp(r+ri(-1,1),0,4);
  return {line:pick(["#ffd2c2","#c9e6ff","#e6ffd2","#ffe7a8","#f0d2ff"]),armor:Math.random()<.7?ARMOR_COL[ar]:null,helm:Math.random()<.55?ARMOR_COL[clamp(ar+ri(-1,0),0,4)]:null,
    weapon:pick(["sword","axe","hammer"]),wcol:RAR[wr].c,wrar:wr,amulet:Math.random()<.4?RAR[r].c:null,scarf:Math.random()<.6?pick(["#ff5a5a","#5ab0ff","#ffd24a","#7cf09a"]):null,k:1,thick:1};
}
const MONSTER_LOOK={
  goblin:{line:"#9be36a",armor:"#6a4a2a",helm:null,weapon:"axe",wcol:"#ff5a5a",wrar:1,amulet:null,scarf:"#c8323c",k:.78,thick:1},
  troll:{line:"#b9c7a2",armor:"#5a6a4a",helm:null,weapon:"hammer",wcol:"#9aa88a",wrar:0,amulet:null,scarf:null,k:1.45,thick:1.7},
  spectre:{line:"#bfe3ff",armor:"#5a7ab8",helm:"#9fc0f0",weapon:"sword",wcol:"#8fd0ff",wrar:3,amulet:"#bfe3ff",scarf:"#4f8fe8",k:1.12,thick:1,glow:true}
};
// ---- Poses (angles en radians ; 0 = vers le bas, + = vers l'avant) ----
const POSE={
  stance:{lean:.12,head:-.05,aF1:.5,aF2:1.3,w:.15,aB1:-.35,aB2:1.0,lF1:.42,lF2:-.55,lB1:-.38,lB2:-.35,rot:0},
  ready:{lean:.22,head:0,aF1:.7,aF2:1.1,w:.3,aB1:-.6,aB2:1.2,lF1:.55,lF2:-.8,lB1:-.5,lB2:-.5,rot:0},
